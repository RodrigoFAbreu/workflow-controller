# Generated by tools/ci_workflows.py -- do not edit by hand.
# Change the model there and run: python3 tools/ci_workflows.py --write
#
# Build and publication: classify the trunk commit and, when a release is due or
# resumable, build, verify and publish it as one release transaction
# (tools/release.py over controller/release_txn.py). Called by ci.yml on main after
# its validate succeeded, with the validate and after-merge results for the same
# commit, so nothing is validated twice. It runs no test of the pushed commit and
# orchestrates none: build and publish require the caller's validate result. Dispatched
# by hand (no inputs) it classifies, names the CI dispatch that publishes, and builds
# nothing. Every action is pinned to a full commit SHA; publish is the only job that
# can write.
#
# build and publish also need the after-merge checks of the commit being published: the
# caller's after-merge results when it is the pushed commit, otherwise release-target-*,
# the one test run left here, on the ancestor release-plan picked (only inside a run the
# caller validated).
#
# GitHub documents GITHUB_SHA for a push event as the "Tip commit pushed to the ref"
# (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#push),
# and for workflow_dispatch as the last commit on the dispatched ref. release-plan peels it with
# git rev-parse "$GITHUB_SHA^{commit}" regardless, a no-op for a commit.
#
# gh release create with asset arguments creates the release as a draft, uploads the assets and
# then publishes it (gh manual: "separate API calls are made to create the release as a draft,
# upload the assets, and then publish the release";
# https://cli.github.com/manual/gh_release_create, and draftWhileUploading in
# https://github.com/cli/cli/blob/trunk/pkg/cmd/release/create/create.go), so the single-command
# form is compatible with immutable releases and no gh release edit is needed. An interrupted
# upload leaves that draft behind, which the next run resumes.
name: "Build and publish"
"on":
  workflow_call:
    inputs:
      validate-result:
        description: "The caller's tests.yml result for github.sha."
        type: string
        required: false
        default: ""
      after-merge-determinism:
        description: "The caller's after-merge-determinism result for github.sha."
        type: string
        required: false
        default: ""
      after-merge-mutations:
        description: "The caller's after-merge-mutations result for github.sha."
        type: string
        required: false
        default: ""
  workflow_dispatch:
concurrency:
  group: "build-publish-${{ github.run_id }}"
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release-plan:
    if: "!cancelled() && github.ref == 'refs/heads/main'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: "${{ github.token }}"
    outputs:
      state: "${{ steps.classify.outputs.state }}"
      version: "${{ steps.classify.outputs.version }}"
      tag: "${{ steps.classify.outputs.tag }}"
      commit: "${{ steps.classify.outputs.commit }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: classify
        id: classify
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "credential.https://github.com.helper"
          GIT_CONFIG_VALUE_0: "!gh auth git-credential"
        run: "python3 tools/release.py classify --commit \"$(git rev-parse \"$GITHUB_SHA^{commit}\")\""
      - name: "no test results"
        if: "inputs.validate-result != 'success'"
        run: "echo '::notice::Build and publish was handed no test results, so it builds nothing. To publish, dispatch the CI workflow on main: it runs the tests and calls this workflow with their results.'"
  release-target-determinism:
    needs:
      - release-plan
    if: "!cancelled() && needs.release-plan.result == 'success' && inputs.validate-result == 'success' && github.ref == 'refs/heads/main' && (needs.release-plan.outputs.state == 'RELEASE_DUE' || needs.release-plan.outputs.state == 'RESUME') && needs.release-plan.outputs.commit != github.sha"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "${{ needs.release-plan.outputs.commit }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "install (editable)"
        run: "pip install -e ."
      - name: "allow unprivileged user namespaces"
        run: "if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi"
      - name: determinism
        run: "python3 tools/run_tests.py main-check tests.test_catalogue_determinism"
  release-target-mutations:
    needs:
      - release-plan
    if: "!cancelled() && needs.release-plan.result == 'success' && inputs.validate-result == 'success' && github.ref == 'refs/heads/main' && (needs.release-plan.outputs.state == 'RELEASE_DUE' || needs.release-plan.outputs.state == 'RESUME') && needs.release-plan.outputs.commit != github.sha"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "${{ needs.release-plan.outputs.commit }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "install (editable)"
        run: "pip install -e ."
      - name: "allow unprivileged user namespaces"
        run: "if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi"
      - name: mutations
        run: "python3 tools/run_tests.py main-check tests.test_scenarios_negative"
  build:
    needs:
      - release-plan
      - release-target-determinism
      - release-target-mutations
    if: "!cancelled() && inputs.validate-result == 'success' && needs.release-plan.result == 'success' && github.ref == 'refs/heads/main' && (needs.release-plan.outputs.state == 'RELEASE_DUE' || needs.release-plan.outputs.state == 'RESUME') && ((needs.release-plan.outputs.commit == github.sha && inputs.after-merge-determinism == 'success') || (needs.release-plan.outputs.commit != github.sha && needs.release-target-determinism.result == 'success')) && ((needs.release-plan.outputs.commit == github.sha && inputs.after-merge-mutations == 'success') || (needs.release-plan.outputs.commit != github.sha && needs.release-target-mutations.result == 'success'))"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: "${{ needs.release-plan.outputs.version }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "${{ needs.release-plan.outputs.commit }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: build
        run: "python3 tools/release.py build"
      - name: verify
        run: "python3 tools/release.py verify"
      - name: "pipx smoke test"
        run: |
          pipx install dist/*.whl
          expected="workflow-controller $RELEASE_VERSION"
          actual="$(workflow-controller --version)"
          actual="${actual%%$'\n'*}"
          if [ "$actual" != "$expected" ]; then
            echo "workflow-controller --version line 1 is '$actual', expected '$expected'" >&2
            exit 1
          fi
      - name: checksums
        run: "python3 tools/release.py checksums dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
  publish:
    needs:
      - release-plan
      - build
      - release-target-determinism
      - release-target-mutations
    if: "!cancelled() && inputs.validate-result == 'success' && needs.release-plan.result == 'success' && needs.build.result == 'success' && github.ref == 'refs/heads/main' && (needs.release-plan.outputs.state == 'RELEASE_DUE' || needs.release-plan.outputs.state == 'RESUME') && ((needs.release-plan.outputs.commit == github.sha && inputs.after-merge-determinism == 'success') || (needs.release-plan.outputs.commit != github.sha && needs.release-target-determinism.result == 'success')) && ((needs.release-plan.outputs.commit == github.sha && inputs.after-merge-mutations == 'success') || (needs.release-plan.outputs.commit != github.sha && needs.release-target-mutations.result == 'success'))"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: "${{ github.token }}"
      COMMIT: "${{ needs.release-plan.outputs.commit }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: publish
        run: "python3 tools/release.py publish --commit \"$COMMIT\""
