# Generated by tools/ci_workflows.py -- do not edit by hand.
# Change the model there and run: python3 tools/ci_workflows.py --write
#
# The entry point: every pull request, every push to main and workflow_dispatch. It
# calls the required validation (tests.yml); except on a pull request it runs the
# two after-merge checks beside it; on main, once validate succeeded, it calls
# build-publish.yml with those results, so the revision is validated once before a
# release. A pull request's newer push cancels its older run; main's runs never cancel
# one another (main-release). Milestone branches are validated through their Draft PR.
#
# reuse (read-only, never on a pull request) is switched by the repository variable
# CI_MAIN_REUSE. on: reuse runs first and validate skips the shards when the recorded
# tree and plan digest match. Any other value: reuse does not run and validate starts
# at once. The report-only mode is the separate workflow main-reuse-report.yml. See
# docs/guide/ci-and-releases.md.
#
# after-merge-determinism and after-merge-mutations run the two whole-catalogue scenario
# checks on the pushed commit (tools/run_tests.py main-check); they are never reused or
# skipped. Every action outside validate is pinned to a full commit SHA.
name: CI
"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: "${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || github.ref == 'refs/heads/main' && 'main-release' || format('{0}-{1}', github.workflow, github.run_id) }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
permissions:
  contents: read
jobs:
  reuse:
    if: "vars.CI_MAIN_REUSE == 'on' && github.event_name != 'pull_request'"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: "${{ github.token }}"
      CI_MAIN_REUSE: "${{ vars.CI_MAIN_REUSE }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "find the pull request run"
        id: find
        run: "python3 tools/ci_reuse.py find --repo \"$GITHUB_REPOSITORY\" --sha \"$GITHUB_SHA\" --event \"$GITHUB_EVENT_NAME\" --ref \"$GITHUB_REF\" --mode \"$CI_MAIN_REUSE\" --facts reuse/facts.json"
      - if: "steps.find.outputs.candidate != ''"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: "timings-ci-attempt-*"
          path: reuse/recorded
          run-id: "${{ steps.find.outputs.candidate }}"
          github-token: "${{ github.token }}"
          repository: "${{ github.repository }}"
      - if: "steps.find.outputs.candidate != ''"
        continue-on-error: true
        name: "install (editable)"
        run: "pip install -e ."
      - if: "steps.find.outputs.candidate != ''"
        continue-on-error: true
        name: "plan (to compare its digest)"
        run: "python3 tools/run_tests.py plan --profile ci --ci-placement --output reuse/plan.json"
      - name: decide
        id: decide
        run: "python3 tools/ci_reuse.py decide --facts reuse/facts.json --reused-dir reuse/recorded --plan reuse/plan.json"
    outputs:
      run-id: "${{ steps.decide.outputs.run-id }}"
  validate:
    needs:
      - reuse
    if: "!cancelled()"
    permissions:
      contents: read
      actions: read
    uses: "./.github/workflows/tests.yml"
    with:
      tests-from-run: "${{ vars.CI_MAIN_REUSE == 'on' && needs.reuse.outputs.run-id || '' }}"
  after-merge-determinism:
    if: "github.event_name != 'pull_request'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "install (editable)"
        run: "pip install -e ."
      - name: "allow unprivileged user namespaces"
        run: "if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi"
      - name: determinism
        run: "python3 tools/run_tests.py main-check tests.test_catalogue_determinism"
  after-merge-mutations:
    if: "github.event_name != 'pull_request'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "install (editable)"
        run: "pip install -e ."
      - name: "allow unprivileged user namespaces"
        run: "if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi"
      - name: mutations
        run: "python3 tools/run_tests.py main-check tests.test_scenarios_negative"
  build-publish:
    needs:
      - validate
      - after-merge-determinism
      - after-merge-mutations
    if: "!cancelled() && needs.validate.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'"
    permissions:
      contents: write
      actions: read
    uses: "./.github/workflows/build-publish.yml"
    with:
      validate-result: "${{ needs.validate.result }}"
      after-merge-determinism: "${{ needs.after-merge-determinism.result }}"
      after-merge-mutations: "${{ needs.after-merge-mutations.result }}"
