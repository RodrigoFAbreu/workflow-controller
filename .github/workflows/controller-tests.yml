# The Controller's own test suite (CP9, `docs/ai-workflow/CONTROLLER_GEN1_PLAN.md`).
#
# Runs the hermetic, default `tests/` suite -- including
# `tests/test_plan_document_consistency.py` -- on every push/PR, alongside
# the existing frozen conformance workflow, which this does not touch.
# `tests.test_integration_disposable_repo` is deliberately absent: it
# requires a live `claude` binary, network access and real spend
# (`CONTROLLER_LIVE_WORKER=1`), none of which CI may depend on.
name: Controller tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  controller-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install (editable)
        run: pip install -e .
      - name: Controller suite
        run: python3 -m unittest discover -s tests -t . -v
