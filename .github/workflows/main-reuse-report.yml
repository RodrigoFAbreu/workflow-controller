# Generated by tools/ci_workflows.py -- do not edit by hand.
# Change the model there and run: python3 tools/ci_workflows.py --write
#
# Report-only reuse (CI_MAIN_REUSE unset, report or an unknown value): logs, in
# its job summary, whether the merged pull request's CI run could have stood in
# for main's shards. A workflow apart from main.yml: nothing waits for it, it does
# not share main-release's concurrency group, and it cannot fail Main. Read-only;
# the logic is tools/ci_reuse.py, shared with main.yml's reuse job.
name: "Main reuse report"
"on":
  push:
    branches:
      - main
concurrency:
  group: "main-reuse-report-${{ github.sha }}"
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  reuse-report:
    if: "vars.CI_MAIN_REUSE != 'on' && vars.CI_MAIN_REUSE != 'off'"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: "${{ github.token }}"
      CI_MAIN_REUSE: "${{ vars.CI_MAIN_REUSE }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "find the pull request run"
        id: find
        run: "python3 tools/ci_reuse.py find --repo \"$GITHUB_REPOSITORY\" --sha \"$GITHUB_SHA\" --event \"$GITHUB_EVENT_NAME\" --ref \"$GITHUB_REF\" --mode \"$CI_MAIN_REUSE\" --facts reuse/facts.json"
      - if: "steps.find.outputs.candidate != ''"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: "timings-ci-attempt-*"
          path: reuse/recorded
          run-id: "${{ steps.find.outputs.candidate }}"
          github-token: "${{ github.token }}"
          repository: "${{ github.repository }}"
      - if: "steps.find.outputs.candidate != ''"
        continue-on-error: true
        name: "install (editable)"
        run: "pip install -e ."
      - if: "steps.find.outputs.candidate != ''"
        continue-on-error: true
        name: "plan (to compare its digest)"
        run: "python3 tools/run_tests.py plan --profile ci --ci-placement --output reuse/plan.json"
      - name: decide
        id: decide
        run: "python3 tools/ci_reuse.py decide --facts reuse/facts.json --reused-dir reuse/recorded --plan reuse/plan.json"
    continue-on-error: true
