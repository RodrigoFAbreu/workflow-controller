# Generated by tools/ci_workflows.py -- do not edit by hand.
# Change the model there and run: python3 tools/ci_workflows.py --write
#
# Trunk: validate every push to main, then classify it and, when a release is due or
# resumable, build, verify and publish it as one release transaction
# (tools/release.py over controller/release_txn.py). Runs never cancel one another.
# Every action outside validate is pinned to a full commit SHA; publish is the only
# job that can write.
#
# reuse and reuse-report (read-only) are switched by the repository variable
# CI_MAIN_REUSE. Unset or report: reuse-report logs, beside validate and without
# blocking it, whether the merged pull request's CI run could stand in for the
# shards; the shards still run. on: reuse runs first and validate skips the shards
# when the recorded tree and plan digest match. off: neither job runs; any other
# value is reported as off. See docs/guide/ci-and-releases.md.
#
# GitHub documents GITHUB_SHA for a push event as the "Tip commit pushed to the ref"
# (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#push),
# and for workflow_dispatch as the last commit on the dispatched ref. release-plan peels it with
# git rev-parse "$GITHUB_SHA^{commit}" regardless, a no-op for a commit.
#
# gh release create with asset arguments creates the release as a draft, uploads the assets and
# then publishes it (gh manual: "separate API calls are made to create the release as a draft,
# upload the assets, and then publish the release";
# https://cli.github.com/manual/gh_release_create, and draftWhileUploading in
# https://github.com/cli/cli/blob/trunk/pkg/cmd/release/create/create.go), so the single-command
# form is compatible with immutable releases and no gh release edit is needed. An interrupted
# upload leaves that draft behind, which the next run resumes.
name: Main
"on":
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: main-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  reuse:
    if: "vars.CI_MAIN_REUSE == 'on'"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: "${{ github.token }}"
      CI_MAIN_REUSE: "${{ vars.CI_MAIN_REUSE }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "find the pull request run"
        id: find
        run: "python3 tools/ci_reuse.py find --repo \"$GITHUB_REPOSITORY\" --sha \"$GITHUB_SHA\" --event \"$GITHUB_EVENT_NAME\" --ref \"$GITHUB_REF\" --mode \"$CI_MAIN_REUSE\" --facts reuse/facts.json"
      - if: "steps.find.outputs.candidate != ''"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: "timings-ci-attempt-*"
          path: reuse/recorded
          run-id: "${{ steps.find.outputs.candidate }}"
          github-token: "${{ github.token }}"
          repository: "${{ github.repository }}"
      - if: "steps.find.outputs.candidate != ''"
        continue-on-error: true
        name: "install (editable)"
        run: "pip install -e ."
      - if: "steps.find.outputs.candidate != ''"
        continue-on-error: true
        name: "plan (to compare its digest)"
        run: "python3 tools/run_tests.py plan --profile ci --ci-placement --output reuse/plan.json"
      - name: decide
        id: decide
        run: "python3 tools/ci_reuse.py decide --facts reuse/facts.json --reused-dir reuse/recorded --plan reuse/plan.json"
    outputs:
      run-id: "${{ steps.decide.outputs.run-id }}"
  reuse-report:
    if: "vars.CI_MAIN_REUSE != 'on' && vars.CI_MAIN_REUSE != 'off'"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: "${{ github.token }}"
      CI_MAIN_REUSE: "${{ vars.CI_MAIN_REUSE }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "find the pull request run"
        id: find
        run: "python3 tools/ci_reuse.py find --repo \"$GITHUB_REPOSITORY\" --sha \"$GITHUB_SHA\" --event \"$GITHUB_EVENT_NAME\" --ref \"$GITHUB_REF\" --mode \"$CI_MAIN_REUSE\" --facts reuse/facts.json"
      - if: "steps.find.outputs.candidate != ''"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: "timings-ci-attempt-*"
          path: reuse/recorded
          run-id: "${{ steps.find.outputs.candidate }}"
          github-token: "${{ github.token }}"
          repository: "${{ github.repository }}"
      - if: "steps.find.outputs.candidate != ''"
        continue-on-error: true
        name: "install (editable)"
        run: "pip install -e ."
      - if: "steps.find.outputs.candidate != ''"
        continue-on-error: true
        name: "plan (to compare its digest)"
        run: "python3 tools/run_tests.py plan --profile ci --ci-placement --output reuse/plan.json"
      - name: decide
        id: decide
        run: "python3 tools/ci_reuse.py decide --facts reuse/facts.json --reused-dir reuse/recorded --plan reuse/plan.json"
    continue-on-error: true
  validate:
    needs:
      - reuse
    if: "!cancelled()"
    permissions:
      contents: read
      actions: read
    uses: "./.github/workflows/validate.yml"
    with:
      tests-from-run: "${{ needs.reuse.outputs.run-id }}"
  release-plan:
    needs:
      - validate
    if: "github.ref == 'refs/heads/main'"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: "${{ github.token }}"
    outputs:
      state: "${{ steps.classify.outputs.state }}"
      version: "${{ steps.classify.outputs.version }}"
      tag: "${{ steps.classify.outputs.tag }}"
      commit: "${{ steps.classify.outputs.commit }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: classify
        id: classify
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "credential.https://github.com.helper"
          GIT_CONFIG_VALUE_0: "!gh auth git-credential"
        run: "python3 tools/release.py classify --commit \"$(git rev-parse \"$GITHUB_SHA^{commit}\")\""
  build:
    needs:
      - validate
      - release-plan
    if: "github.ref == 'refs/heads/main' && (needs.release-plan.outputs.state == 'RELEASE_DUE' || needs.release-plan.outputs.state == 'RESUME')"
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: "${{ needs.release-plan.outputs.version }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "${{ needs.release-plan.outputs.commit }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: build
        run: "python3 tools/release.py build"
      - name: verify
        run: "python3 tools/release.py verify"
      - name: "pipx smoke test"
        run: |
          pipx install dist/*.whl
          expected="workflow-controller $RELEASE_VERSION"
          actual="$(workflow-controller --version)"
          actual="${actual%%$'\n'*}"
          if [ "$actual" != "$expected" ]; then
            echo "workflow-controller --version line 1 is '$actual', expected '$expected'" >&2
            exit 1
          fi
      - name: checksums
        run: "python3 tools/release.py checksums dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
  publish:
    needs:
      - validate
      - release-plan
      - build
    if: "github.ref == 'refs/heads/main' && (needs.release-plan.outputs.state == 'RELEASE_DUE' || needs.release-plan.outputs.state == 'RESUME')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: "${{ github.token }}"
      COMMIT: "${{ needs.release-plan.outputs.commit }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: publish
        run: "python3 tools/release.py publish --commit \"$COMMIT\""
