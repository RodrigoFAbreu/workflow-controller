# Generated by tools/ci_workflows.py -- do not edit by hand.
# Change the model there and run: python3 tools/ci_workflows.py --write
#
# Checks every pull request's title against the policy committed on its merge ref
# (tools/release.py check-title). The title becomes the squash commit's subject,
# whose Conventional Commit type decides the release. The title is passed through
# the environment only. The job's name is the required check context.
name: "PR title"
"on":
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
permissions:
  contents: read
jobs:
  title:
    name: "PR title"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "check title"
        env:
          TITLE: "${{ github.event.pull_request.title }}"
        run: "python3 tools/release.py check-title \"$TITLE\""
