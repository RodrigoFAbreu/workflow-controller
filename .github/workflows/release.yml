# Generated by tools/ci_workflows.py -- do not edit by hand.
# Change the model there and run: python3 tools/ci_workflows.py --write
#
# Tag-triggered release: validate, build and publish an immutable GitHub Release.
# Every action is pinned to a full commit SHA; publish is the only job that can write.
#
# GitHub documents GITHUB_SHA for a push event as the "Tip commit pushed to the ref"
# (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#push),
# so an annotated tag push should carry the tagged commit, not the tag object. build peels it with
# git rev-parse "$GITHUB_SHA^{commit}" regardless, a no-op for a commit.
#
# gh release create with asset arguments creates the release as a draft, uploads the assets and
# then publishes it (gh manual: "separate API calls are made to create the release as a draft,
# upload the assets, and then publish the release";
# https://cli.github.com/manual/gh_release_create, and draftWhileUploading in
# https://github.com/cli/cli/blob/trunk/pkg/cmd/release/create/create.go), so the single-command
# form is compatible with immutable releases and no gh release edit is needed.
name: Release
"on":
  push:
    tags:
      - "v*"
concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    uses: "./.github/workflows/validate.yml"
  build:
    needs:
      - validate
    runs-on: ubuntu-latest
    outputs:
      release_commit: "${{ steps.peel.outputs.release_commit }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "verify tag"
        run: "python3 tools/release.py verify-tag \"$GITHUB_REF_NAME\""
      - name: "resolve release commit"
        id: peel
        run: |
          RELEASE_COMMIT=$(git rev-parse "$GITHUB_SHA^{commit}")
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: "release commit is on main"
        run: "git merge-base --is-ancestor \"$RELEASE_COMMIT\" origin/main"
      - name: "build wheel"
        run: "WORKFLOW_CONTROLLER_RELEASE_TAG=\"$GITHUB_REF_NAME\" python -m pip wheel --no-deps -w dist ."
      - name: "verify wheel"
        run: "python3 tools/release.py verify-wheel dist/*.whl --tag \"$GITHUB_REF_NAME\" --commit \"$RELEASE_COMMIT\""
      - name: "pipx smoke test"
        run: |
          pipx install dist/*.whl
          expected="workflow-controller $(python3 tools/release.py version)"
          actual="$(workflow-controller --version)"
          actual="${actual%%$'\n'*}"
          if [ "$actual" != "$expected" ]; then
            echo "workflow-controller --version line 1 is '$actual', expected '$expected'" >&2
            exit 1
          fi
      - name: checksums
        run: "python3 tools/release.py checksums dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
  publish:
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: "${{ github.token }}"
      RELEASE_COMMIT: "${{ needs.build.outputs.release_commit }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: "release does not exist yet"
        run: "python3 tools/release.py check-unpublished \"$GITHUB_REF_NAME\""
      - name: "re-verify downloaded wheel"
        run: "python3 tools/release.py verify-wheel dist/*.whl --tag \"$GITHUB_REF_NAME\" --commit \"$RELEASE_COMMIT\""
      - name: "tag still names the release commit"
        run: "python3 tools/release.py verify-tag-commit \"$GITHUB_REF_NAME\" \"$RELEASE_COMMIT\""
      - name: "publish release"
        run: "gh release create \"$GITHUB_REF_NAME\" dist/*.whl dist/SHA256SUMS --verify-tag --title \"$GITHUB_REF_NAME\" --notes \"workflow-controller $GITHUB_REF_NAME\""
