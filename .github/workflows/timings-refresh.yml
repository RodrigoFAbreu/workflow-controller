# Generated by tools/ci_workflows.py -- do not edit by hand.
# Change the model there and run: python3 tools/ci_workflows.py --write
#
# Weekly (and by hand) refresh of tools/test_timings.json from the shard records
# of recent pull-request runs (tools/timings_refresh.py): collect, merge, run the
# staleness ratchet on the merged file, then push the branch ci/timings-refresh
# and open or update the one pull request. A workflow apart from ci.yml, so it
# can never hold main-release's slot; schedule and dispatch only, so a fork
# cannot reach it. The run listing and artifact download use github.token with
# actions: read; the push and the pull request use the repository secret
# TIMINGS_REFRESH_TOKEN, because a pull request opened with github.token starts
# no pull_request workflow and its required checks would never run. Without the
# secret the job fails with a message naming it.
name: "Timings refresh"
"on":
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch: {}
concurrency:
  group: timings-refresh
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  refresh:
    name: "refresh the shard timings"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "install (editable)"
        run: "pip install -e ."
      - name: "collect the shard records of recent pull-request runs"
        id: collect
        env:
          GH_TOKEN: "${{ github.token }}"
        run: "python3 tools/timings_refresh.py collect --repo \"$GITHUB_REPOSITORY\" --output-dir timings-refresh"
      - name: "merge them into the committed timings"
        id: change
        if: "steps.collect.outputs.count != '0'"
        run: "python3 tools/timings_refresh.py plan-change --dirs-file timings-refresh/dirs.txt --output tools/test_timings.json"
      - name: "check the merged timings against the staleness ratchet"
        if: "steps.change.outputs.changed == 'true'"
        run: "python3 tools/run_tests.py tests.test_test_shards"
      - name: "push the branch and open or update the pull request"
        if: "steps.change.outputs.changed == 'true'"
        env:
          TIMINGS_REFRESH_TOKEN: "${{ secrets.TIMINGS_REFRESH_TOKEN }}"
        run: "python3 tools/timings_refresh.py propose --repo \"$GITHUB_REPOSITORY\""
