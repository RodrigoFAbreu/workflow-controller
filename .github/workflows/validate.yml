# Generated by tools/ci_workflows.py -- do not edit by hand.
# Change the model there and run: python3 tools/ci_workflows.py --write
#
# The required validation, called by ci.yml and main.yml. Its input tests-from-run is
# empty except when main.yml reuses a pull request run (CI_MAIN_REUSE=on); then the
# shards are skipped and tests-result re-verifies that run's recorded results. A pull
# request that changes only documentation (tools/ci_changes.py) skips plan and tests;
# the docs job runs on every event and tests-result requires it.
name: Validate
"on":
  workflow_call:
    inputs:
      tests-from-run:
        description: "Id of a pull request run to reuse the results of; empty runs the shards."
        type: string
        required: false
        default: ""
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: "${{ steps.detect.outputs.code }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: detect
        id: detect
        run: "python3 tools/ci_changes.py detect"
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "install (editable)"
        run: "pip install -e ."
      - name: "documentation checks"
        run: |
          python3 tools/check_docs.py
          python3 -m unittest tests.test_docs tests.test_backlog
  plan:
    needs:
      - changes
    if: "needs.changes.outputs.code == 'true'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      shards: "${{ steps.plan.outputs.shards }}"
      count: "${{ steps.plan.outputs.count }}"
      digest: "${{ steps.plan.outputs.digest }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "install (editable)"
        run: "pip install -e ."
      - name: plan
        id: plan
        run: "python3 tools/run_tests.py plan --profile ci --ci-placement --output plan.json --github-output"
      - uses: actions/upload-artifact@v4
        with:
          name: test-plan
          path: plan.json
  tests:
    name: "tests (${{ matrix.shard }})"
    needs:
      - changes
      - plan
    if: "inputs.tests-from-run == '' && needs.changes.outputs.code == 'true'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: "${{ fromJSON(needs.plan.outputs.shards) }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "install (editable)"
        run: "pip install -e ."
      - name: "allow unprivileged user namespaces"
        run: "if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi"
      - name: shard
        run: "python3 tools/run_tests.py exec-shard --profile ci --ci-placement --shard ${{ matrix.shard }} --expect-digest ${{ needs.plan.outputs.digest }} --results-dir results --run-attempt ${{ github.run_attempt }}"
      - if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: "results-${{ matrix.shard }}-attempt-${{ github.run_attempt }}"
          path: results/
  tests-result:
    needs:
      - changes
      - docs
      - plan
      - tests
    if: "always()"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: "needs.changes.outputs.code == 'true'"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-plan
          path: results
      - if: "inputs.tests-from-run == '' && needs.changes.outputs.code == 'true'"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "results-*"
          path: results/shards
      - if: "inputs.tests-from-run != '' && needs.changes.outputs.code == 'true'"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "timings-ci-attempt-*"
          path: reused
          run-id: "${{ inputs.tests-from-run }}"
          github-token: "${{ github.token }}"
          repository: "${{ github.repository }}"
      - name: "verify the reused results"
        id: verify
        if: "inputs.tests-from-run != '' && needs.changes.outputs.code == 'true'"
        run: "python3 tools/ci_reuse.py verify --reused-dir reused --plan results/plan.json"
      - name: aggregate
        if: "inputs.tests-from-run == '' && needs.changes.outputs.code == 'true'"
        run: "python3 tools/run_tests.py aggregate --plan results/plan.json --results-dir results/shards --run-attempt ${{ github.run_attempt }} --write-selected results/selected --upstream-result plan=${{ needs.plan.result }} --upstream-result tests=${{ needs.tests.result }} --plan-artifact test-plan --results-artifact-prefix results-"
      - name: "aggregate the reused results"
        if: "inputs.tests-from-run != '' && needs.changes.outputs.code == 'true'"
        run: "python3 tools/run_tests.py aggregate --plan results/plan.json --results-dir ${{ steps.verify.outputs.selected-dir }} --write-selected results/selected --upstream-result plan=${{ needs.plan.result }}"
      - name: "record the tree"
        if: "always() && needs.changes.outputs.code == 'true'"
        run: "mkdir -p results/selected && git rev-parse 'HEAD^{tree}' > results/selected/tree.txt"
      - if: "always() && needs.changes.outputs.code == 'true'"
        uses: actions/upload-artifact@v4
        with:
          name: "timings-ci-attempt-${{ github.run_attempt }}"
          path: results/selected/
      - name: "require the gate"
        if: "always()"
        run: "python3 tools/ci_changes.py require --changes ${{ needs.changes.result }} --docs ${{ needs.docs.result }} --code \"${{ needs.changes.outputs.code }}\""
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "build prerequisite"
        run: "pip install \"setuptools>=70.1\""
      - name: "build wheel"
        run: "python -m pip wheel --no-deps -w dist ."
      - name: "verify wheel"
        run: "python3 tools/release.py verify-wheel dist/*.whl --local --commit \"$(git rev-parse \"$GITHUB_SHA^{commit}\")\""
      - name: "packaged runtime tests"
        run: "CONTROLLER_REQUIRE_PACKAGING_TESTS=1 python -m unittest tests.test_packaged_runtime -v"
      - name: "pipx smoke test"
        run: |
          pipx install dist/*.whl
          expected="workflow-controller $(python3 tools/release.py version)"
          actual="$(workflow-controller --version)"
          actual="${actual%%$'\n'*}"
          if [ "$actual" != "$expected" ]; then
            echo "workflow-controller --version line 1 is '$actual', expected '$expected'" >&2
            exit 1
          fi
