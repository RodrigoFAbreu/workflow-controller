# Generated by tools/ci_workflows.py -- do not edit by hand.
# Change the model there and run: python3 tools/ci_workflows.py --write
#
# The required validation, called by ci.yml and main.yml.
name: Validate
"on":
  workflow_call:
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      shards: "${{ steps.plan.outputs.shards }}"
      count: "${{ steps.plan.outputs.count }}"
      digest: "${{ steps.plan.outputs.digest }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "install (editable)"
        run: "pip install -e ."
      - name: plan
        id: plan
        run: "python3 tools/run_tests.py plan --profile ci --ci-placement --output plan.json --github-output"
      - uses: actions/upload-artifact@v4
        with:
          name: test-plan
          path: plan.json
  tests:
    name: "tests (${{ matrix.shard }})"
    needs:
      - plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: "${{ fromJSON(needs.plan.outputs.shards) }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "install (editable)"
        run: "pip install -e ."
      - name: shard
        run: "python3 tools/run_tests.py exec-shard --profile ci --ci-placement --shard ${{ matrix.shard }} --expect-digest ${{ needs.plan.outputs.digest }} --results-dir results"
      - if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: "results-${{ matrix.shard }}"
          path: results/
  tests-result:
    needs:
      - plan
      - tests
    if: "always()"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-plan
          path: results
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "results-*"
          merge-multiple: true
          path: results
      - name: aggregate
        run: "python3 tools/run_tests.py aggregate --plan results/plan.json --results-dir results"
      - if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: timings-ci
          path: |
            results/plan.json
            results/shard-*.json
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "build prerequisite"
        run: "pip install \"setuptools>=70.1\""
      - name: "build wheel"
        run: "python -m pip wheel --no-deps -w dist ."
      - name: "verify wheel"
        run: "python3 tools/release.py verify-wheel dist/*.whl --local --commit \"$(git rev-parse \"$GITHUB_SHA^{commit}\")\""
      - name: "packaged runtime tests"
        run: "CONTROLLER_REQUIRE_PACKAGING_TESTS=1 python -m unittest tests.test_packaged_runtime -v"
      - name: "pipx smoke test"
        run: |
          pipx install dist/*.whl
          expected="workflow-controller $(python3 tools/release.py version)"
          actual="$(workflow-controller --version)"
          actual="${actual%%$'\n'*}"
          if [ "$actual" != "$expected" ]; then
            echo "workflow-controller --version line 1 is '$actual', expected '$expected'" >&2
            exit 1
          fi
