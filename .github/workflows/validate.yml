# Generated by tools/ci_workflows.py -- do not edit by hand.
# Change the model there and run: python3 tools/ci_workflows.py --write
#
# The required validation, called by ci.yml and main.yml.
name: Validate
"on":
  workflow_call:
jobs:
  controller:
    name: "controller (${{ matrix.shard }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: identity
            modules: "tests.test_identity tests.test_runtime tests.test_package_structure tests.test_write_containment tests.test_lock tests.test_handoff"
          - shard: job
            modules: "tests.test_job tests.test_job_validation"
          - shard: resume
            modules: tests.test_resume
          - shard: decision
            modules: "tests.test_evidence tests.test_decision tests.test_golden_plan_stage_decisions tests.test_target_state tests.test_managed_repo tests.test_routing"
          - shard: cli
            modules: "tests.test_cli tests.test_lifecycle_orchestration"
          - shard: worker
            modules: "tests.test_worker tests.test_observe tests.test_observation_equivalence"
          - shard: docs
            modules: "tests.test_plan_document_consistency tests.test_checklist_corrections tests.test_ci_workflows tests.test_release_tools tests.test_buildinfo"
          - shard: trunk
            modules: "tests.test_version_authority tests.test_repo_policy tests.test_gitrepo tests.test_forge tests.test_milestone_branch tests.test_pull_request_lifecycle tests.test_release_txn tests.test_no_rewrite_invariants"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "install (editable)"
        run: "pip install -e ."
      - name: "Controller tests"
        run: "python -m unittest ${{ matrix.modules }} -v"
  conformance:
    name: "conformance (${{ matrix.suite }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite:
          - workflow_fingerprint_test.py
          - workflow_state_test.py
          - workflow_test_harness_test.py
          - workflow_integration_test.py
          - workflow_acceptance_matrix_test.py
          - workflow_state_completion_obligations_test.py
          - workflow_fingerprint_generalization_test.py
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "conformance suite"
        working-directory: scripts
        run: "python3 ${{ matrix.suite }}"
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "build prerequisite"
        run: "pip install \"setuptools>=70.1\""
      - name: "build wheel"
        run: "python -m pip wheel --no-deps -w dist ."
      - name: "verify wheel"
        run: "python3 tools/release.py verify-wheel dist/*.whl --local --commit \"$(git rev-parse \"$GITHUB_SHA^{commit}\")\""
      - name: "packaged runtime tests"
        run: "CONTROLLER_REQUIRE_PACKAGING_TESTS=1 python -m unittest tests.test_packaged_runtime -v"
      - name: "pipx smoke test"
        run: |
          pipx install dist/*.whl
          expected="workflow-controller $(python3 tools/release.py version)"
          actual="$(workflow-controller --version)"
          actual="${actual%%$'\n'*}"
          if [ "$actual" != "$expected" ]; then
            echo "workflow-controller --version line 1 is '$actual', expected '$expected'" >&2
            exit 1
          fi
