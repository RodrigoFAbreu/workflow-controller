[project]
name = "workflow-controller"
version = "1.2.1"
description = "Workflow Controller -- Generation 1: automates operation of the Workflow state machine over managed repositories."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
workflow-controller = "controller.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["controller"]

[tool.setuptools.package-data]
controller = ["GENERATION.json"]
